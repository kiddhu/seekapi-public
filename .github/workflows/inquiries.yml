name: Inquiry validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_INQUIRIES_ENABLED: '1'
          INQUIRIES_ENABLED: '0'
      - run: python3 tests/http-closed.py
